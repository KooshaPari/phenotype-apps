[workspace]
members = [
    "crates/eidolon-core",
    "crates/eidolon-desktop",
    "crates/eidolon-mobile",
    "crates/eidolon-sandbox",
    "crates/kmobile",
]

resolver = "3"

[workspace.package]
rust-version = "1.75"
version = "0.0.1"
edition = "2021"
authors = ["Phenotype Team"]
repository = "https://github.com/KooshaPari/Eidolon"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.39", features = ["full"] }
log = "0.4"
async-trait = "0.1"
uuid = { version = "1.6", features = ["v4", "serde"] }
anyhow = "1.0"
phenotype-error-core = { path = "../pheno/crates/phenotype-error-core" }
