[workspace]
resolver = "2"
# NOTE(absorption 2026-07-17): `crates/tracely-sentinel` was in this workspace at the source
# KooshaPari/Tracely repo but is actually a phenotype-infrakit rate-limit/bulkhead crate
# (phenotype-sentinel), not Tracely content. It was absorbed separately into
# phenotype-infrakit and is intentionally NOT copied here.
members = [
  "crates/tracely-core",
] # absorbed(2026-07-17): removed `crates/tracely-sentinel` → phenotype-infrakit/phenotype-sentinel
[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/KooshaPari/Tracely"
authors = ["Koosha Pari <kooshapari@users.noreply.github.com>"]

[workspace.dependencies]
criterion = "0.5"
