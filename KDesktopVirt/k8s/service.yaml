apiVersion: v1
kind: Service
metadata:
  name: kvirtualstage-service
  namespace: kvirtualstage
  labels:
    app: kvirtualstage
    component: service
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
    prometheus.io/scrape: "true"
    prometheus.io/port: "9090"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
    name: http
  - port: 9090
    targetPort: 9090
    protocol: TCP
    name: metrics
  selector:
    app: kvirtualstage
    component: application
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800  # 3 hours
---
apiVersion: v1
kind: Service
metadata:
  name: kvirtualstage-loadbalancer
  namespace: kvirtualstage
  labels:
    app: kvirtualstage
    component: loadbalancer
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
    service.beta.kubernetes.io/aws-load-balancer-backend-protocol: "tcp"
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-interval: "10"
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-timeout: "5"
    service.beta.kubernetes.io/aws-load-balancer-healthy-threshold: "2"
    service.beta.kubernetes.io/aws-load-balancer-unhealthy-threshold: "2"
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
    name: http
  - port: 443
    targetPort: 8080
    protocol: TCP
    name: https
  selector:
    app: kvirtualstage
    component: application
  loadBalancerSourceRanges:
  - 10.0.0.0/8      # Private networks
  - 172.16.0.0/12   # Private networks
  - 192.168.0.0/16  # Private networks
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kvirtualstage-ingress
  namespace: kvirtualstage
  labels:
    app: kvirtualstage
    component: ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Frame-Options: DENY";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "X-XSS-Protection: 1; mode=block";
      more_set_headers "Strict-Transport-Security: max-age=31536000; includeSubDomains";
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/rate-limit: "1000"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - kvirtualstage.example.com
    - api.kvirtualstage.example.com
    secretName: kvirtualstage-tls
  rules:
  - host: kvirtualstage.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: kvirtualstage-service
            port:
              number: 80
  - host: api.kvirtualstage.example.com
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: kvirtualstage-service
            port:
              number: 80
      - path: /metrics
        pathType: Prefix
        backend:
          service:
            name: kvirtualstage-service
            port:
              number: 9090
---
apiVersion: v1
kind: Service
metadata:
  name: kvirtualstage-headless
  namespace: kvirtualstage
  labels:
    app: kvirtualstage
    component: headless-service
spec:
  type: ClusterIP
  clusterIP: None
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
  - port: 9090
    targetPort: 9090
    protocol: TCP
    name: metrics
  selector:
    app: kvirtualstage
    component: application