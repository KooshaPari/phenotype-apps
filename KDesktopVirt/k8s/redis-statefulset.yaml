apiVersion: v1
kind: Service
metadata:
  name: kvirtualstage-redis
  namespace: kvirtualstage
  labels:
    app: kvirtualstage-redis
    component: database
spec:
  ports:
  - port: 6379
    targetPort: 6379
    name: redis
  clusterIP: None
  selector:
    app: kvirtualstage-redis
---
apiVersion: v1
kind: Service
metadata:
  name: kvirtualstage-redis-headless
  namespace: kvirtualstage
  labels:
    app: kvirtualstage-redis
    component: database
spec:
  type: ClusterIP
  clusterIP: None
  ports:
  - port: 6379
    targetPort: 6379
    name: redis
  selector:
    app: kvirtualstage-redis
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kvirtualstage-redis
  namespace: kvirtualstage
  labels:
    app: kvirtualstage-redis
    component: database
spec:
  serviceName: kvirtualstage-redis-headless
  replicas: 3
  selector:
    matchLabels:
      app: kvirtualstage-redis
  template:
    metadata:
      labels:
        app: kvirtualstage-redis
        component: database
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9121"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        fsGroup: 1001
        runAsUser: 1001
        runAsNonRoot: true
      containers:
      - name: redis
        image: redis:7.2-alpine
        ports:
        - containerPort: 6379
          name: redis
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: kvirtualstage-redis-secret
              key: password
        command:
        - redis-server
        - /etc/redis/redis.conf
        - --requirepass $(REDIS_PASSWORD)
        - --appendonly yes
        - --save 900 1
        - --save 300 10
        - --save 60 10000
        - --maxmemory 2gb
        - --maxmemory-policy allkeys-lru
        - --tcp-keepalive 60
        - --timeout 300
        volumeMounts:
        - name: redis-data
          mountPath: /data
        - name: redis-config
          mountPath: /etc/redis
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: 500m
            memory: 2Gi
        livenessProbe:
          exec:
            command:
            - redis-cli
            - --no-auth-warning
            - -a
            - $(REDIS_PASSWORD)
            - ping
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          exec:
            command:
            - redis-cli
            - --no-auth-warning
            - -a
            - $(REDIS_PASSWORD)
            - ping
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      - name: redis-exporter
        image: oliver006/redis_exporter:v1.45.0
        ports:
        - containerPort: 9121
          name: metrics
        env:
        - name: REDIS_ADDR
          value: "redis://localhost:6379"
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: kvirtualstage-redis-secret
              key: password
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi
      volumes:
      - name: redis-config
        configMap:
          name: redis-config
  volumeClaimTemplates:
  - metadata:
      name: redis-data
      labels:
        app: kvirtualstage-redis
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: "fast-ssd"
      resources:
        requests:
          storage: 20Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config
  namespace: kvirtualstage
data:
  redis.conf: |
    # Redis configuration for KVirtualStage cluster
    bind 0.0.0.0
    port 6379
    
    # Persistence
    save 900 1
    save 300 10
    save 60 10000
    stop-writes-on-bgsave-error yes
    rdbcompression yes
    rdbchecksum yes
    dbfilename dump.rdb
    dir /data
    
    # AOF
    appendonly yes
    appendfilename "appendonly.aof"
    appendfsync everysec
    no-appendfsync-on-rewrite no
    auto-aof-rewrite-percentage 100
    auto-aof-rewrite-min-size 64mb
    
    # Memory management
    maxmemory 2gb
    maxmemory-policy allkeys-lru
    
    # Network
    tcp-keepalive 60
    timeout 300
    tcp-backlog 511
    
    # Logging
    loglevel notice
    logfile ""
    
    # Client management
    maxclients 10000
    
    # Slow log
    slowlog-log-slower-than 10000
    slowlog-max-len 128
---
apiVersion: v1
kind: Secret
metadata:
  name: kvirtualstage-redis-secret
  namespace: kvirtualstage
type: Opaque
