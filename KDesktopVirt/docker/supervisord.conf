[supervisord]
nodaemon=true
user=kvirtualstage
logfile=/app/logs/supervisord.log
pidfile=/app/supervisord.pid

[program:kvirtualstage]
command=kvirtualstage start --ui --host 0.0.0.0 --port 3000
directory=/app
user=kvirtualstage
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/app/logs/kvirtualstage.log
stderr_logfile=/app/logs/kvirtualstage-error.log

[program:mcp-server]
command=kvirtualstage mcp start --port 3001
directory=/app
user=kvirtualstage
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/app/logs/mcp-server.log
stderr_logfile=/app/logs/mcp-server-error.log