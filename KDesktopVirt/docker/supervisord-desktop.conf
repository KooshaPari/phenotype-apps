[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:vnc]
command=/app/entrypoint.sh
user=kvirtualstage
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/vnc.log
stderr_logfile=/var/log/supervisor/vnc.log

[program:kvirtualstage]
command=kvirtualstage start --ui --port 3000 --host 0.0.0.0
directory=/app
user=kvirtualstage
autostart=true
autorestart=true
environment=DISPLAY=":1",HOME="/app"
stdout_logfile=/var/log/supervisor/kvirtualstage.log
stderr_logfile=/var/log/supervisor/kvirtualstage.log