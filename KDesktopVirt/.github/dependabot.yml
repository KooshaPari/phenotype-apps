version: 2
# Archive/legacy paths are intentionally NOT scanned:
#   - /kvirtualstage-legacy/**  (removed in commit 0abb04c, 2026-04)
# Do not add these paths back to `directory:` or `directories:` entries.
# If archive contents are restored, prefer a per-ecosystem `ignore` block
# matching `kvirtualstage-legacy/**` rather than enabling scans.
updates:
  - package-ecosystem: "cargo"
    # Use directories (plural) with explicit allowlist and legacy negation
    # so future restorations of kvirtualstage-legacy are not auto-scanned.
    directories:
      - "/"
      - "!/kvirtualstage-legacy/**"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      cargo:
        patterns: ["*"]
    open-pull-requests-limit: 10
  - package-ecosystem: "cargo"
    directory: "/cli_tools"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      cargo:
        patterns: ["*"]
    open-pull-requests-limit: 5
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
    groups:
      github-actions:
        patterns: ["*"]
    open-pull-requests-limit: 5
