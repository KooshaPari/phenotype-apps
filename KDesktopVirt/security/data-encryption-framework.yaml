# Data Protection and Encryption Framework for KVirtualStage Enterprise
# This file defines comprehensive data encryption and protection policies

apiVersion: v1
kind: ConfigMap
metadata:
  name: kvirtualstage-encryption-config
  namespace: kvirtualstage-security
  labels:
    app: kvirtualstage
    component: encryption
    security-tier: enterprise
data:
  encryption-config.yaml: |
    # Data Encryption Configuration
    encryption:
      # Encryption at Rest Configuration
      at_rest:
        # Database Encryption
        database:
          enabled: true
          algorithm: "AES-256-GCM"
          key_rotation_days: 90
          
          # PostgreSQL encryption settings
          postgresql:
            transparent_data_encryption: true
            column_encryption:
              enabled: true
              sensitive_columns:
                - "users.password_hash"
                - "credentials.encrypted_data"
                - "sessions.user_data"
                - "audit_logs.sensitive_data"
                - "api_keys.key_hash"
            tablespace_encryption: true
            backup_encryption: true
            
          # Redis encryption settings
          redis:
            encryption_at_rest: true
            memory_encryption: true
            rdb_encryption: true
            aof_encryption: true
            
        # File System Encryption
        filesystem:
          enabled: true
          
          # Container storage encryption
          container_storage:
            algorithm: "AES-256-XTS"
            driver: "dm-crypt"
            key_size: 256
            
          # Persistent volume encryption
          persistent_volumes:
            storage_class: "encrypted-ssd"
            encryption_provider: "aws-kms"  # or "azure-kv", "gcp-kms"
            key_id: "arn:aws:kms:us-west-2:123456789012:key/12345678-1234-1234-1234-123456789012"
            
          # Virtual desktop storage encryption
          virtual_desktop_storage:
            algorithm: "AES-256-GCM"
            per_session_keys: true
            automatic_cleanup: true
            retention_period: 30  # days
            
        # Backup Encryption
        backup:
          enabled: true
          algorithm: "AES-256-GCM"
          compression_before_encryption: true
          verification_enabled: true
          
          # Backup storage encryption
          storage:
            provider: "aws-s3"  # or "azure-blob", "gcp-storage"
            bucket_encryption: "SSE-KMS"
            versioning: true
            lifecycle_management: true
            
      # Encryption in Transit Configuration
      in_transit:
        # TLS Configuration
        tls:
          version: "1.3"
          minimum_version: "1.2"
          cipher_suites:
            - "TLS_AES_256_GCM_SHA384"
            - "TLS_CHACHA20_POLY1305_SHA256"
            - "TLS_AES_128_GCM_SHA256"
            - "TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384"
            - "TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305"
            - "TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256"
          
          # Certificate configuration
          certificates:
            type: "rsa"
            key_size: 4096
            validity_period: 365  # days
            san_enabled: true
            wildcard_enabled: false
            
          # HSTS configuration
          hsts:
            enabled: true
            max_age: 31536000  # 1 year
            include_subdomains: true
            preload: true
            
        # Internal service communication
        internal_communication:
          mutual_tls: true
          service_mesh: "istio"
          certificate_authority: "internal-ca"
          auto_rotation: true
          
        # API encryption
        api_encryption:
          end_to_end: true
          field_level_encryption:
            enabled: true
            sensitive_fields:
              - "password"
              - "token"
              - "api_key"
              - "personal_data"
              - "credentials"
          request_signing: true
          response_signing: true

    # Key Management Infrastructure (KMS)
    key_management:
      # Primary KMS provider
      primary_provider: "aws-kms"  # or "azure-kv", "gcp-kms", "hashicorp-vault"
      
      # AWS KMS Configuration
      aws_kms:
        region: "us-west-2"
        customer_managed_keys:
          database_encryption: "arn:aws:kms:us-west-2:123456789012:key/database-key"
          file_encryption: "arn:aws:kms:us-west-2:123456789012:key/file-key"
          backup_encryption: "arn:aws:kms:us-west-2:123456789012:key/backup-key"
          session_encryption: "arn:aws:kms:us-west-2:123456789012:key/session-key"
        
        # Key policies
        key_policies:
          rotation_enabled: true
          rotation_period: 365  # days
          deletion_window: 30   # days
          cross_account_access: false
          
      # HashiCorp Vault Configuration (Alternative/Secondary)
      vault:
        address: "https://vault.company.com"
        namespace: "kvirtualstage"
        
        # Transit secrets engine for encryption as a service
        transit:
          enabled: true
          mount_path: "transit"
          keys:
            database_key:
              type: "aes256-gcm96"
              exportable: false
              deletion_allowed: false
            file_key:
              type: "aes256-gcm96"
              exportable: false
              deletion_allowed: false
            
        # Database secrets engine
        database_secrets:
          enabled: true
          mount_path: "database"
          connections:
            postgresql:
              plugin_name: "postgresql-database-plugin"
              connection_url: "postgresql://{{username}}:{{password}}@postgres:5432/kvirtualstage"
              max_open_connections: 5
              max_idle_connections: 0
              max_connection_lifetime: "1h"
              
      # Key rotation policies
      rotation:
        automatic: true
        schedule:
          database_keys: "0 2 1 */3 *"  # Every 3 months
          file_keys: "0 2 1 */6 *"      # Every 6 months
          session_keys: "0 2 * * 0"      # Weekly
          api_keys: "0 2 1 * *"         # Monthly
          
        # Rotation procedures
        procedures:
          pre_rotation_backup: true
          verification_required: true
          rollback_capability: true
          notification_enabled: true
          
      # Key escrow and recovery
      escrow:
        enabled: true
        threshold_scheme: "3-of-5"  # Shamir's Secret Sharing
        escrow_agents:
          - "security-officer@company.com"
          - "compliance-officer@company.com"
          - "cto@company.com"
          - "legal-counsel@company.com"
          - "external-auditor@auditing-firm.com"
        recovery_procedures:
          multi_party_authorization: true
          audit_logging: true
          time_locked_recovery: 72  # hours

    # Advanced Encryption Features
    advanced_encryption:
      # Homomorphic Encryption
      homomorphic:
        enabled: false  # Experimental feature
        library: "SEAL"
        use_cases:
          - "analytics_on_encrypted_data"
          - "privacy_preserving_ml"
          
      # Format Preserving Encryption (FPE)
      format_preserving:
        enabled: true
        algorithm: "FF1"
        use_cases:
          - "credit_card_numbers"
          - "social_security_numbers"
          - "phone_numbers"
          
      # Searchable Encryption
      searchable:
        enabled: true
        algorithm: "OPE"  # Order Preserving Encryption
        use_cases:
          - "encrypted_database_queries"
          - "range_queries_on_encrypted_data"
          
      # Zero-Knowledge Proofs
      zero_knowledge:
        enabled: false  # Research/future feature
        use_cases:
          - "authentication_without_password_disclosure"
          - "compliance_verification"

    # Data Classification and Protection
    data_classification:
      # Classification levels
      levels:
        public:
          encryption_required: false
          access_controls: "basic"
          retention_period: "unlimited"
          
        internal:
          encryption_required: true
          encryption_algorithm: "AES-128-GCM"
          access_controls: "role_based"
          retention_period: "7_years"
          
        confidential:
          encryption_required: true
          encryption_algorithm: "AES-256-GCM"
          access_controls: "need_to_know"
          retention_period: "5_years"
          dlp_scanning: true
          
        restricted:
          encryption_required: true
          encryption_algorithm: "AES-256-GCM"
          access_controls: "multi_factor_auth"
          retention_period: "3_years"
          dlp_scanning: true
          watermarking: true
          geographic_restrictions: true
          
      # Automatic classification
      auto_classification:
        enabled: true
        ml_model: "microsoft_purview"  # or "google_dlp", "aws_macie"
        patterns:
          credit_card: "\\d{4}[\\s-]?\\d{4}[\\s-]?\\d{4}[\\s-]?\\d{4}"
          ssn: "\\d{3}-\\d{2}-\\d{4}"
          email: "[\\w\\.-]+@[\\w\\.-]+\\.\\w+"
          phone: "\\(?\\d{3}\\)?[\\s.-]?\\d{3}[\\s.-]?\\d{4}"
          
    # Data Loss Prevention (DLP)
    dlp:
      enabled: true
      
      # Content inspection
      content_inspection:
        file_types: ["pdf", "docx", "xlsx", "pptx", "txt", "csv"]
        scan_compressed: true
        scan_encrypted: false  # Cannot scan encrypted content
        max_file_size: "100MB"
        
      # Detection policies
      policies:
        pii_detection:
          enabled: true
          confidence_threshold: 0.8
          actions: ["block", "quarantine", "alert"]
          
        financial_data:
          enabled: true
          patterns: ["credit_card", "bank_account", "routing_number"]
          actions: ["encrypt", "alert", "audit"]
          
        healthcare_data:
          enabled: true
          patterns: ["medical_record", "patient_id", "diagnosis_code"]
          actions: ["encrypt", "restrict_access", "audit"]
          
      # Response actions
      response_actions:
        automatic:
          quarantine: true
          notification: true
          encryption: true
        manual:
          investigation: true
          approval_workflow: true
          remediation: true

    # Compliance and Regulations
    compliance:
      # GDPR Compliance
      gdpr:
        enabled: true
        right_to_erasure: true
        data_portability: true
        privacy_by_design: true
        consent_management: true
        
      # HIPAA Compliance
      hipaa:
        enabled: false  # Enable if processing healthcare data
        baa_required: true
        minimum_necessary: true
        access_logging: true
        
      # SOX Compliance
      sox:
        enabled: true
        change_management: true
        segregation_of_duties: true
        evidence_retention: true
        
      # PCI DSS Compliance
      pci_dss:
        enabled: false  # Enable if processing payment data
        cardholder_data_encryption: true
        key_management: true
        access_monitoring: true

---
# TLS Certificate Management
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: kvirtualstage-ca-issuer
  namespace: kvirtualstage-security
spec:
  ca:
    secretName: kvirtualstage-ca-secret

---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: kvirtualstage-tls-cert
  namespace: kvirtualstage
spec:
  secretName: kvirtualstage-tls-secret
  issuerRef:
    name: kvirtualstage-ca-issuer
    kind: ClusterIssuer
  commonName: kvirtualstage.company.com
  dnsNames:
  - kvirtualstage.company.com
  - api.kvirtualstage.company.com
  - admin.kvirtualstage.company.com
  keySize: 4096
  duration: 8760h  # 1 year
  renewBefore: 720h  # 30 days

---
# Istio Service Mesh Security Configuration
apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: default
  namespace: kvirtualstage
spec:
  mtls:
    mode: STRICT

---
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: kvirtualstage-api-access
  namespace: kvirtualstage
spec:
  selector:
    matchLabels:
      app: kvirtualstage
  rules:
  - from:
    - source:
        principals: ["cluster.local/ns/kvirtualstage/sa/kvirtualstage-api"]
  - to:
    - operation:
        methods: ["GET", "POST", "PUT", "DELETE"]
        paths: ["/api/*"]
    when:
    - key: source.certificate_fingerprint
      values: ["*"]  # Require client certificate

---
# Encryption at Rest for Persistent Volumes
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: encrypted-ssd
  annotations:
    storageclass.kubernetes.io/is-default-class: "false"
provisioner: kubernetes.io/aws-ebs
parameters:
  type: gp3
  fsType: ext4
  encrypted: "true"
  kmsKeyId: "arn:aws:kms:us-west-2:123456789012:key/12345678-1234-1234-1234-123456789012"
allowVolumeExpansion: true
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Delete

---
# Database Encryption Configuration
apiVersion: v1
kind: Secret
metadata:
  name: kvirtualstage-db-encryption-keys
  namespace: kvirtualstage-security
type: Opaque
data:
  # These should be generated and managed by KMS
  master-key: # Base64 encoded AES-256 key
  table-encryption-key: # Base64 encoded AES-256 key
  backup-encryption-key: # Base64 encoded AES-256 key

---
# Field-Level Encryption Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: kvirtualstage-field-encryption
  namespace: kvirtualstage-security
data:
  field-encryption-config.yaml: |
    field_encryption:
      # Database field encryption
      database_fields:
        users_table:
          password_hash:
            algorithm: "AES-256-GCM"
            key_id: "user-password-key"
            deterministic: false
          email:
            algorithm: "AES-256-GCM"
            key_id: "user-email-key"
            deterministic: true  # For searching
          phone:
            algorithm: "FPE-FF1"  # Format Preserving Encryption
            key_id: "user-phone-key"
            
        credentials_table:
          credential_data:
            algorithm: "AES-256-GCM"
            key_id: "credential-data-key"
            deterministic: false
          oauth_tokens:
            algorithm: "AES-256-GCM"
            key_id: "oauth-token-key"
            deterministic: false
            
        sessions_table:
          session_data:
            algorithm: "AES-256-GCM"
            key_id: "session-data-key"
            deterministic: false
          user_context:
            algorithm: "AES-256-GCM"
            key_id: "user-context-key"
            deterministic: false
            
      # API field encryption
      api_fields:
        request_encryption:
          sensitive_parameters:
            - "password"
            - "api_key"
            - "access_token"
            - "personal_data"
          algorithm: "AES-256-GCM"
          
        response_encryption:
          sensitive_fields:
            - "user_data"
            - "session_token"
            - "internal_ids"
          algorithm: "AES-256-GCM"

---
# HashiCorp Vault Integration
apiVersion: v1
kind: ConfigMap
metadata:
  name: kvirtualstage-vault-config
  namespace: kvirtualstage-security
data:
  vault-config.hcl: |
    # Vault configuration for KVirtualStage
    
    # Storage backend (using Consul for HA)
    storage "consul" {
      address = "consul.vault.svc.cluster.local:8500"
      path    = "vault/"
    }
    
    # API listener
    listener "tcp" {
      address     = "0.0.0.0:8200"
      tls_cert_file = "/vault/tls/server.crt"
      tls_key_file  = "/vault/tls/server.key"
      tls_min_version = "tls12"
    }
    
    # Transit secrets engine for encryption as a service
    path "transit/*" {
      capabilities = ["create", "read", "update", "delete", "list"]
    }
    
    # Database secrets engine
    path "database/*" {
      capabilities = ["create", "read", "update", "delete", "list"]
    }
    
    # KV secrets engine for application secrets
    path "secret/*" {
      capabilities = ["create", "read", "update", "delete", "list"]
    }
    
    # Enable UI
    ui = true
    
    # Auto-unseal with AWS KMS
    seal "awskms" {
      region     = "us-west-2"
      kms_key_id = "arn:aws:kms:us-west-2:123456789012:key/vault-unseal-key"
    }

---
# Backup Encryption Job
apiVersion: batch/v1
kind: CronJob
metadata:
  name: kvirtualstage-encrypted-backup
  namespace: kvirtualstage-security
spec:
  schedule: "0 2 * * *"  # Daily at 2 AM
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
          - name: backup
            image: kvirtualstage/backup:latest
            env:
            - name: ENCRYPTION_KEY_ID
              value: "arn:aws:kms:us-west-2:123456789012:key/backup-key"
            - name: S3_BUCKET
              value: "kvirtualstage-encrypted-backups"
            command:
            - /bin/sh
            - -c
            - |
              # Create encrypted database backup
              pg_dump $DATABASE_URL | \
              aws kms encrypt \
                --key-id $ENCRYPTION_KEY_ID \
                --plaintext fileb:///dev/stdin \
                --output text \
                --query CiphertextBlob | \
              aws s3 cp - s3://$S3_BUCKET/database/$(date +%Y%m%d_%H%M%S).sql.encrypted
              
              # Create encrypted file system backup
              tar czf - /app/data | \
              aws kms encrypt \
                --key-id $ENCRYPTION_KEY_ID \
                --plaintext fileb:///dev/stdin \
                --output text \
                --query CiphertextBlob | \
              aws s3 cp - s3://$S3_BUCKET/filesystem/$(date +%Y%m%d_%H%M%S).tar.gz.encrypted