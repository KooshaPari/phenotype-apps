name: branch-protection

# Tier-0 hygiene: enforce branch protection rules on the default branch.
# This workflow uses the GitHub API to apply protection rules, ensuring
# the `main` branch requires status checks, review, and up-to-date
# branches before merging — even when the initial repo setup was done
# without branch protection enabled in the UI.
#
# Runs on:
#   - `workflow_dispatch` (manual trigger to re-apply rules)
#   - `push` to `.github/workflows/branch-protection.yml` (auto-apply
#     when this file itself is changed)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/branch-protection.yml'

permissions:
  contents: read
  administration: write

jobs:
  enforce:
    name: Enforce branch protection
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Apply branch protection via GitHub API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Build the required_status_checks JSON from known CI checks
          # that must pass before merging.
          STATUS_CHECKS='[
            "Go build & test",
            "go mod verify",
            "License allowlist",
            "staticcheck (Go static analysis)",
            "govulncheck (Go vuln DB)",
            "Trivy filesystem scan",
            "gitleaks (secret scanning)"
          ]'

          echo "Applying branch protection to ${REPO}:main ..."

          # Use the GitHub REST API to upsert protection rules.
          # The endpoint is idempotent: calling it repeatedly with the
          # same parameters is safe and will not change the state.
          #
          # Requires `administration: write` permission on the token.
          curl -sSL -X PUT \
            -H "Authorization: token ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/branches/main/protection" \
            -d "$(cat <<ENDPAYLOAD
          {
            "required_status_checks": {
              "strict": true,
              "checks": ${STATUS_CHECKS}
            },
            "enforce_admins": true,
            "required_pull_request_reviews": {
              "dismiss_stale_reviews": true,
              "require_code_owner_reviews": true,
              "required_approving_review_count": 1
            },
            "restrictions": null,
            "required_linear_history": true,
            "allow_force_pushes": false,
            "allow_deletions": false,
            "block_creations": false,
            "required_conversation_resolution": true,
            "lock_branch": false,
            "allow_fork_syncing": true
          }
          ENDPAYLOAD
          )"

          echo "Branch protection applied successfully."
