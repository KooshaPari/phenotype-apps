name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch when a new commit is pushed.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site-build:
    name: Site build (Astro + Bun)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-site-${{ hashFiles('site/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-site-

      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: site

      - name: Run type check
        run: bun run check
        working-directory: site

      - name: Build site
        run: bun run build
        working-directory: site

  upstream-check:
    name: Upstream check (Plane.so monorepo)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-upstream-${{ hashFiles('upstream/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-upstream-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: upstream

      - name: Run checks (lint + format + types)
        run: pnpm check
        working-directory: upstream
