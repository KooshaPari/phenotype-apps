# Upstream sync: Planify -> makeplane/plane
#
# Scheduled weekly to pull the latest changes from the upstream Plane.so
# repository (makeplane/plane@preview) and open a sync PR.
#
# If there are no new commits, the workflow exits silently. If the sync
# PR cannot be created due to conflicts, the PR body will note the
# conflict status so a maintainer can resolve manually.

name: Upstream sync

on:
  schedule:
    # Weekly on Sunday at 02:00 UTC
    - cron: '0 2 * * 0'
  workflow_dispatch:
    # Allow manual triggering from the Actions tab

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: Sync from makeplane/plane
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Planify with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote and fetch
        run: |
          git remote add upstream https://github.com/makeplane/plane.git
          git fetch upstream preview --no-tags --prune

      - name: Check for new upstream commits
        id: check
        run: |
          # Compare the upstream/preview branch to what we last synced.
          # We track our sync point as the merge-base between our main
          # and upstream/preview.
          MERGE_BASE=$(git merge-base upstream/preview HEAD)
          NEW_COUNT=$(git rev-list --count "$MERGE_BASE"..upstream/preview 2>/dev/null || echo "0")
          echo "NEW_COMMITS=$NEW_COUNT" >> $GITHUB_OUTPUT

          if [ "$NEW_COUNT" -eq 0 ]; then
            echo "No new upstream commits since last sync. Exiting."
            echo "HAS_CHANGES=false" >> $GITHUB_OUTPUT
          else
            echo "HAS_CHANGES=true" >> $GITHUB_OUTPUT
            # Generate a commit summary for the PR body
            echo "COMMIT_LOG<<EOF" >> $GITHUB_OUTPUT
            git log --oneline --no-decorate "$MERGE_BASE"..upstream/preview >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Create sync branch
        if: steps.check.outputs.HAS_CHANGES == 'true'
        run: |
          SYNC_BRANCH="sync/upstream-$(date +%Y%m%d)"
          git checkout -b "$SYNC_BRANCH" upstream/preview
          # Record the sync provenance in a commit message for traceability
          echo "Sync branch: $SYNC_BRANCH"
          echo "Commits to merge:"
          echo "${{ steps.check.outputs.COMMIT_LOG }}"

      - name: Open sync pull request
        if: steps.check.outputs.HAS_CHANGES == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: sync upstream makeplane/plane@preview ($(date +%Y-%m-%d))"
          title: "Upstream sync: makeplane/plane@preview ($(date +%Y-%m-%d))"
          branch: "sync/upstream-$(date +%Y%m%d)"
          base: main
          labels: upstream-sync
          body: |
            ## Upstream Sync

            Automated sync from `makeplane/plane@preview` to Planify.

            ### New commits

            ```
            ${{ steps.check.outputs.COMMIT_LOG }}
            ```

            ### Merge status

            This PR was created by applying upstream/preview on top of the
            current Planify `main`. If conflicts exist, they will be shown
            below and must be resolved manually before merging.

            ### Post-merge checklist

            - [ ] Run `pnpm install` in `upstream/` if `pnpm-lock.yaml` changed
            - [ ] Update `UPSTREAM.md` with the new sync date and commit SHA
            - [ ] Verify CI passes on `main` after merge

            ---
            _Generated by the upstream-sync workflow._
          delete-branch: true
          add-paths: |
            upstream/
