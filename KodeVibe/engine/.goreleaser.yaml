version: 2
project_name: kodevibe
builds:
  - id: kodevibe-cli
    main: ./cmd/cli
    binary: kodevibe
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
  - id: kodevibe-server
    main: ./cmd/server
    binary: kodevibe-server
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
release:
  github:
    owner: KooshaPari
    name: KodeVibe
